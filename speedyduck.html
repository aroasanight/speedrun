<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedy Duck Any% NMG Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 10px;
            line-height: 1.3;
        }
        
        .back-btn {
            display: inline-block;
            padding: 6px 12px;
            background: #ff1493;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        
        .back-btn:hover {
            background: #ff69b4;
        }
        
        h1 {
            color: #ff1493;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .category {
            color: #ff69b4;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .leaderboard {
            max-width: 900px;
        }
        
        .entry {
            display: grid;
            grid-template-columns: 40px 1fr 100px 100px 80px;
            gap: 10px;
            padding: 8px 10px;
            background: #0a0a0a;
            border-left: 3px solid #ff1493;
            margin-bottom: 2px;
            align-items: center;
            font-size: 14px;
        }
        
        .entry:nth-child(1) { border-left-color: #ffd700; }
        .entry:nth-child(2) { border-left-color: #c0c0c0; }
        .entry:nth-child(3) { border-left-color: #cd7f32; }
        
        .rank {
            font-weight: bold;
            color: #ff69b4;
            font-size: 16px;
        }
        
        .entry:nth-child(1) .rank { color: #ffd700; }
        .entry:nth-child(2) .rank { color: #c0c0c0; }
        .entry:nth-child(3) .rank { color: #cd7f32; }
        
        .player {
            font-weight: 600;
        }
        
        .time {
            font-weight: bold;
            color: #ff1493;
            font-size: 15px;
        }
        
        .date {
            color: #888;
            font-size: 13px;
        }
        
        .video-btn {
            padding: 4px 8px;
            background: #ff1493;
            color: #000;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        
        .video-btn:hover {
            background: #ff69b4;
        }
        
        @media (max-width: 600px) {
            .entry {
                grid-template-columns: 30px 1fr 80px;
                gap: 8px;
                font-size: 12px;
            }
            
            .date {
                display: none;
            }
            
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← Back</a>
    
    <h1>Speedy Duck</h1>
    <div class="category">Any% NMG</div>
    
    <div class="leaderboard" id="leaderboard"></div>

    <script>
        const runs = [
            { rank: 1, player: "Placeholder 1", time: "99:99.999", date: "2001-09-11", video: "https://youtube.com/watch?v=dQw4w9WgXcQ" },
            { rank: 2, player: "Placeholder 2", time: "99:99.999", date: "2001-09-11", video: "https://youtube.com/watch?v=dQw4w9WgXcQ" },
            { rank: 3, player: "Placeholder 3", time: "99:99.999", date: "2001-09-11", video: "https://youtube.com/watch?v=dQw4w9WgXcQ" },
            { rank: 4, player: "Placeholder 4", time: "99:99.999", date: "2001-09-11", video: "https://youtube.com/watch?v=dQw4w9WgXcQ" },
            { rank: 5, player: "Placeholder 5", time: "99:99.999", date: "2001-09-11", video: "https://youtube.com/watch?v=dQw4w9WgXcQ" },
        ];

        const leaderboard = document.getElementById('leaderboard');
        
        runs.forEach(run => {
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `
                <div class="rank">#${run.rank}</div>
                <div class="player">${run.player}</div>
                <div class="time">${run.time}</div>
                <div class="date">${run.date}</div>
                <a href="${run.video}" target="_blank" class="video-btn">Video</a>
            `;
            leaderboard.appendChild(entry);
        });
    </script>
</body>
</html>
