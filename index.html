<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedrun Lederboards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            padding: 20px;
            line-height: 1.4;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            color: #ff1493;
            font-size: 36px;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #ff69b4;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .categories {
            display: grid;
            gap: 8px;
        }
        
        .category-card {
            background: #0a0a0a;
            border-left: 4px solid #ff1493;
            padding: 15px 20px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s;
            display: block;
        }
        
        .category-card:hover {
            background: #151515;
            border-left-color: #ff69b4;
            transform: translateX(5px);
        }
        
        .category-name {
            font-size: 20px;
            font-weight: bold;
            color: #ff1493;
            margin-bottom: 5px;
        }
        
        .category-desc {
            font-size: 14px;
            color: #aaa;
        }
        
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #222;
            text-align: center;
            color: #666;
            font-size: 13px;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .category-name {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Speedrun Lederboards</h1>
        <!-- <div class="subtitle">Speedrun Leaderboards</div> -->
        
        <div class="categories">
            <a href="/speeedyduck" class="category-card">
                <div class="category-name">Speeedy Duck Any% NMG</div>
                <div class="category-desc">Beat the game as fast as possible without major glitches</div>
            </a>
            
            <!-- <a href="/speedyduck-glitchless" class="category-card">
                <div class="category-name">100% Glitchless</div>
                <div class="category-desc">Collect all items and reach the top without any glitches</div>
            </a>
            
            <a href="/speedyduck-anyglitch" class="category-card">
                <div class="category-name">Any% - Unrestricted</div>
                <div class="category-desc">Anything goes - use any glitches to reach the top</div>
            </a>
            
            <a href="/speedyduck-lowpercent" class="category-card">
                <div class="category-name">Low%</div>
                <div class="category-desc">Beat the game with minimum items collected</div>
            </a> -->
        </div>
        
        <!-- <div class="footer">
            Getting Over It with Speedy Duck © 2024
        </div> -->
    </div>
</body>
</html>
